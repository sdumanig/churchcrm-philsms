name: RC3 offline PHP checks

on:
  push:
    branches:
      - feature/rc3-leader-registry-migrations
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Configure PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Lint RC3 PHP files
        run: |
          php -l src/PhilSMSPlugin.php
          php -l tests/activation-migration-contract.php
          php -l tools/rc3-migration-preflight.php
          php -l tools/rc3-apply-migrations.php
          php -l src/CliPropelAdapter.php
          php -l tests/rc32-cli-propel-adapter-offline.php
          php -l tests/rc32-real-perpl-integration.php
          php -l tests/rc3-migration-cli-integration.php
          php -l src/LeaderRepository.php
          php -l src/MigrationRunner.php
          php -l tests/leader-repository-unit.php
          php -l tests/migration-runner-unit.php
          php -l tests/migration-runner-integration.php
          php -l tests/leader-repository-integration.php
          php -l src/AssignmentEligibility.php
          php -l tests/assignment-eligibility-integration.php
          php -l routes/routes.php
          php -l views/manage.php
          php -l tests/assignment-overview-render.php
          php -l tests/assignment-route-contract.php
          php -l tests/assignment-route-behavior.php
          php -l src/AssignmentService.php
          php -l tests/assignment-service-integration.php
          php -l tests/assignment-route-mysql-integration.php
      - name: Refuse unauthorized CLI migration attempts
        run: |
          if php tools/rc3-apply-migrations.php --apply /nonexistent/bootstrap.php staging_test; then
            echo 'FAIL: Unauthorized migration attempt was accepted' >&2
            exit 1
          fi
      - name: Exercise unwired RC3.2 adapter safety contract
        run: php tests/rc32-cli-propel-adapter-offline.php
      - name: Validate reviewed RC3 migration manifest
        run: |
          php tools/rc3-migration-preflight.php
          php tools/rc3-migration-preflight.php --json | php -r '$m=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR); if (($m["mode"] ?? "") !== "read-only" || count($m["migrations"] ?? []) !== 3) exit(1);'
      - name: Verify activation migration ordering
        run: php tests/activation-migration-contract.php
      - name: Check assignment route security contract
        run: php tests/assignment-route-contract.php
      - name: Exercise assignment route request handling
        run: php tests/assignment-route-behavior.php
      - name: Render RC3 assignment overview fixtures
        run: php tests/assignment-overview-render.php
      - name: Run offline leader repository tests
        run: php tests/leader-repository-unit.php
      - name: Run offline migration runner contract checks
        run: php tests/migration-runner-unit.php
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_only_root_password
          MYSQL_DATABASE: philsms_test_staging_rc3
          MYSQL_USER: philsms_test
          MYSQL_PASSWORD: test_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_only_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PHILSMS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=philsms_test_staging_rc3;charset=utf8mb4
      PHILSMS_TEST_USER: philsms_test
      PHILSMS_TEST_PASSWORD: test_only_password
      PHILSMS_TEST_ALLOW_DDL: 'YES'
      PHILSMS_LIVE_SEND: '0'
    steps:
      - uses: actions/checkout@v5
      - name: Configure PHP 8.3 with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Exercise gated CLI migration against disposable MySQL
        run: php tests/rc3-migration-cli-integration.php
      - name: Run isolated migration integration test
        run: php tests/migration-runner-integration.php
      - name: Run leader repository integration test
        run: php tests/leader-repository-integration.php
      - name: Run assignment eligibility integration test
        run: php tests/assignment-eligibility-integration.php
      - name: Run transactional assignment integration test
        run: php tests/assignment-service-integration.php
      - name: Exercise assignment route with isolated MySQL
        run: php tests/assignment-route-mysql-integration.php

  real-perpl-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_only_root_password
          MYSQL_DATABASE: philsms_test_staging_rc32
          MYSQL_USER: philsms_test
          MYSQL_PASSWORD: test_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_only_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PHILSMS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=philsms_test_staging_rc32;charset=utf8mb4
      PHILSMS_TEST_USER: philsms_test
      PHILSMS_TEST_PASSWORD: test_only_password
      PHILSMS_TEST_ALLOW_DDL: 'YES'
      PHILSMS_LIVE_SEND: '0'
      PHILSMS_RC3_STAGING: 'YES'
    steps:
      - uses: actions/checkout@v5
      - name: Configure PHP 8.4 with MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install pinned real Perpl without scripts or plugins
        run: composer install --no-interaction --no-progress --no-scripts --no-plugins --working-dir=tests/fixtures/rc32-real-perpl
      - name: Verify real Perpl connection and identity
        run: php tests/rc32-real-perpl-integration.php success
      - name: Reject mismatched expected database
        run: |
          if php tests/rc32-real-perpl-integration.php wrong-expected; then
            echo 'FAIL: real Perpl adapter accepted mismatched database' >&2
            exit 1
          fi
      - name: Reject live sending authorization
        env:
          PHILSMS_LIVE_SEND: '1'
        run: |
          if php tests/rc32-real-perpl-integration.php success; then
            echo 'FAIL: real Perpl adapter accepted live sending' >&2
            exit 1
          fi
